name = "algosize"
main = "src/index.js"
compatibility_date = "2024-09-23"

# ----------------------------------------------------------------------------
# KV namespace bindings
# ----------------------------------------------------------------------------
# IDs are real Cloudflare namespace IDs. Locally, Miniflare maps these to
# in-memory KV (no real Cloudflare reads/writes). In production they bind to
# the real namespaces created with `wrangler kv namespace create <NAME> --config wrangler.toml`.
[[kv_namespaces]]
binding = "SESSIONS"
id      = "2a67b8b8fa4444f2b04b4ee7b98407dc"

[[kv_namespaces]]
binding = "USERS"
id      = "b321f8eeccf0422694b87f719fa0d70c"

# ----------------------------------------------------------------------------
# D1 database binding — user records + run history (Task #25).
# ----------------------------------------------------------------------------
# Holds the `users` table (replaces the user:/email:/cust: keys previously
# in USERS KV) and the `runs` table (replaces the run:/runs: keys previously
# in RUNS KV). SESSIONS KV stays for session JWTs + Stripe-event dedup, and
# USERS KV stays for monthly quota counters at quota:<userId>:<YYYY-MM>.
#
# The placeholder database_id below is for local dev (Miniflare maps it to
# an in-memory SQLite); production + staging override with the real UUIDs
# printed by `wrangler d1 create algosize --config wrangler.toml`. See DEPLOY.md §2.5.
[[d1_databases]]
binding       = "DB"
database_name = "algosize"
database_id   = "00000000-0000-0000-0000-000000000000"

# ----------------------------------------------------------------------------
# R2 bucket — rendered client-facing reports (Task #P-6)
# ----------------------------------------------------------------------------
# Objects are the HTML report for one run, keyed `reports/<orgId>/<runId>.html`
# so an org's reports are a single prefix — which makes "delete everything for
# this customer" a prefix delete rather than a scan.
#
# Provision once per account before deploying:
#   wrangler r2 bucket create algosize-reports --config wrangler.toml
#
# EVERY READ AND WRITE TOLERATES THIS BINDING BEING ABSENT (see
# src/reports/store.js). Until the bucket exists the report route renders on
# demand instead — slower, identical bytes — so a missing bucket degrades
# performance rather than breaking the feature or the deploy.
[[r2_buckets]]
binding     = "REPORTS"
bucket_name = "algosize-reports"

# ----------------------------------------------------------------------------
# Service binding — algorithm-optimizer sandbox (Task #16)
# ----------------------------------------------------------------------------
# The main Worker calls `env.SANDBOX.fetch(...)` to run user-supplied JS in a
# sibling Worker's isolate so a runaway loop can't take down the API. The
# sibling Worker lives in `/worker-sandbox` and must be deployed first:
#   cd worker-sandbox && wrangler deploy --config wrangler.toml --env production
# In single-Worker dev mode (no service binding) the main Worker falls back
# to in-process execution — same code, same sandbox model, just no
# CPU-budget isolation between Workers.
[[services]]
binding = "SANDBOX"
service = "algosize-sandbox"

# Workers AI — powers the algorithm optimizer's refactor suggestions and the
# per-finding "Generate fix" endpoint (Kimi K2.6 by default; see
# analyzers/llm.js for the provider chain). Keyless: the binding IS the
# credential, so no secret to provision, wipe, or restore. CI cannot use a
# binding (it runs in Node) — it goes through the Workers AI REST API with
# CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_AI_TOKEN instead.
[ai]
binding = "AI"

# ----------------------------------------------------------------------------
# Scheduled monitoring (migrations/0006) — Cron Trigger + Queue
# ----------------------------------------------------------------------------
# The cron fires once daily; its handler only decides which monitors are due
# and puts one message per monitor on SCAN_QUEUE. The consumer below runs the
# actual audit, one monitor per message, so a slow or hanging repo delays
# only itself instead of starving the rest of the sweep. See src/monitors/run.js.
#
# 03:00 UTC: off-peak for both GitHub and OSV.dev, and far enough from
# midnight that a repo's own nightly CI has usually finished publishing.
#
# BEFORE DEPLOYING: the queue must exist, or `wrangler deploy` fails with
# "queue not found" — creating it is not implied by this config.
#   wrangler queues create algosize-scans --config wrangler.toml
#   wrangler queues create algosize-scans-staging --config wrangler.toml
# Queues also require a paid Workers plan. If the queue binding is absent at
# runtime the sweep refuses to run monitors inline and captures instead — see
# sweepDueMonitors — so a half-provisioned deploy is loud rather than
# silently serialising every scan into one cron invocation.
#
# HOURLY, not daily (D-8). The tick is the clock a monitor's time-of-day
# setting is read against — with a single 03:00 trigger, a monitor asking for
# 14:00 would simply never come due. An hourly tick costs one
# listMonitorsDue query per hour and enqueues nothing the other 23 times:
# isDue holds a monitor to its own hour, and a monitor that never chose one
# falls back to DEFAULT_SWEEP_HOUR — 03:00, the hour every existing monitor
# already ran at. So this change gives new monitors a real choice without
# moving anybody's existing delivery time.
[triggers]
crons = ["0 * * * *"]

[[queues.producers]]
binding = "SCAN_QUEUE"
queue   = "algosize-scans"

[[queues.consumers]]
queue          = "algosize-scans"
max_batch_size = 10
max_retries    = 3
# Failures that exhaust max_retries go here rather than vanishing. Create it
# alongside the main queue: `wrangler queues create algosize-scans-dlq --config wrangler.toml`.
dead_letter_queue = "algosize-scans-dlq"

# ----------------------------------------------------------------------------
# Default (local-dev) public env vars. Override per-environment below.
# ----------------------------------------------------------------------------
[vars]
SITE_ORIGIN = "http://localhost:5000"
COOKIE_NAME = "algosize_session"
# Analytics noscript-pixel forwarder (Task #26). The Worker accepts a GET
# at /api/pageview from <noscript><img> and POSTs server-side to Plausible.
# Override PLAUSIBLE_ENDPOINT for self-hosted; ANALYTICS_DOMAIN must match
# the site's _config.production.yml `analytics.domain`.
ANALYTICS_DOMAIN  = "algosize.com"
PLAUSIBLE_ENDPOINT = "https://plausible.io"
# Transactional email (Task #56) — Google Workspace via Gmail API.
# EMAIL_FROM         displayed From: header (RFC 5322 with optional name).
# EMAIL_DELEGATED_USER  Workspace mailbox the service account impersonates
#                    via domain-wide delegation. Must match a real user
#                    inbox on the Workspace tenant. The Gmail API send
#                    URL embeds this as the {userId} path segment.
# EMAIL_REPLY_TO     optional override for the Reply-To: header. If unset,
#                    replies go back to EMAIL_FROM.
# Local dev: leave the placeholder values; sendTransactional treats
# missing GOOGLE_SERVICE_ACCOUNT_JSON as "not configured" and silently
# no-ops with a single warn-level log line. See DEPLOY.md §3.6.
EMAIL_FROM           = "Algosize <noreply@algosize.com>"
EMAIL_DELEGATED_USER = "noreply@algosize.com"
# Comma-separated allowlist of admin email addresses. Anyone in this list,
# once signed in, can hit /api/admin/* and view the signed-up email roster.
# Override per-environment below.
ADMIN_EMAILS         = "guillaumelauzier@gmail.com"
# Custom report domains (migrations/0015). A Firm customer points a CNAME at
# this hostname; the Worker verifies the record over DNS-over-HTTPS before it
# will call the domain verified. See src/domains.js.
#
# Verifying the record is NOT the same as serving from it: terminating TLS for
# a hostname somebody else owns is Cloudflare for SaaS (custom hostnames),
# which needs zone-level credentials this Worker deliberately does not carry.
# Until that is provisioned, leave CUSTOM_HOSTNAMES_ENABLED unset — the API
# then reports `servingReady: false` and the UI says DNS is correct but the
# hostname is not live yet, rather than implying a domain works when it does
# not. See DEPLOY-account-management.md.
REPORT_CNAME_TARGET  = "cname.algosize.com"

# ----------------------------------------------------------------------------
# NO top-level `[[durable_objects.bindings]]` / `[[migrations]]` for USAGE.
#
# Tried it, and it broke the deploy. The USAGE Durable Object (src/quota.js,
# src/usage-counter.js) is declared under [env.production] and [env.staging]
# only. Adding a matching pair up here looks like it would just give
# `wrangler dev` the same quota semantics production has — and `wrangler
# deploy --dry-run` accepts it for both envs — but the top-level `name` on
# line 1 is ALSO "algosize", so the default env and the production env target
# the same Worker script. That leaves two migration chains each declaring
# `new_sqlite_classes = ["UsageCounter"]` against one script, and the remote
# apply fails where the dry-run cannot (dry-run never contacts the migration
# state, so this is invisible until Workers Builds tries it for real).
#
# Consequence to know about: without the binding, a bare `wrangler dev` falls
# back to the non-atomic KV counter in src/quota.js, so the free-tier limit
# does NOT hold under concurrency locally the way it does in production. That
# is a dev/prod semantic difference, and it is deliberate rather than
# overlooked. Use `wrangler dev --env production` to exercise the real gate;
# the DO's behaviour itself is covered by scripts/test-quota-concurrency.mjs,
# which stubs the namespace and does not need a binding.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Production overrides (used by `wrangler deploy --env production`).
# Cookie name stays the same; SITE_ORIGIN points to the deployed site/worker.
# Update SITE_ORIGIN once the marketing site has its own domain so CORS,
# cookie scope, and Stripe redirects line up with where the user actually
# loads the site from.
# ----------------------------------------------------------------------------
[env.production]
name   = "algosize"
# REQUIRED because `routes` is set below. Wrangler decides whether to publish
# the <name>.<subdomain>.workers.dev host with:
#
#   const deployToWorkersDev = config.workers_dev ?? routes.length === 0;
#
# so leaving this unset while `routes` is non-empty resolves to `false` and
# every deploy takes the Worker OFF workers.dev. That is the host SITE_ORIGIN
# points at (the algosize.com/api/* route below is kept dormant for a future
# custom-domain switch), so an unset value silently removes the API from its
# own documented origin — which is exactly what happened on the first
# automated deploy: `wrangler deploy` succeeded and /api/me started returning
# 404. `worker/scripts/test-wrangler-config.mjs` now fails the build if this
# invariant is broken again.
workers_dev = true
# Same-origin API binding so the browser can POST to https://algosize.com/api/*
# without CORS preflights and so session cookies are first-party. The marketing
# site is served by GitHub Pages on the apex; this route hands /api/* to the
# Worker. Mirrors the staging block below. See DEPLOY.md §4.2.
routes = [
  { pattern = "algosize.com/api/*", zone_name = "algosize.com" },
  # OAuth discovery. The spec puts these at the ORIGIN root, not under a
  # prefix — a client given https://algosize.com/api/mcp fetches
  # https://algosize.com/.well-known/oauth-protected-resource and nothing
  # else. Without these two the Claude.ai "add a connector" flow cannot
  # start at all, which is the one connection method the dashboard
  # advertises that API keys do not already cover.
  #
  # EXACT paths, deliberately. algosize.com/* routes to the algosize-site
  # Worker (wrangler.jsonc, DEPLOY.md §9.3); Cloudflare picks the most
  # specific match, so these two win for their own paths and change nothing
  # else on the apex. A wildcard like /.well-known/* would claim paths this
  # Worker does not serve — ACME challenges among them — and hand them a
  # JSON 404 instead of letting the site Worker answer.
  #
  # src/index.js already registers both handlers at these paths, plus
  # /api/.well-known/… aliases that work under `wrangler dev` (no zone
  # routes at all) and during the ~2 minutes these take to propagate.
  { pattern = "algosize.com/.well-known/oauth-protected-resource",   zone_name = "algosize.com" },
  { pattern = "algosize.com/.well-known/oauth-authorization-server", zone_name = "algosize.com" },
]

[env.production.vars]
# Production site origin: must match the hostname users load the site from.
# Used for CORS allow-list, cookie scope, AND every browser-facing redirect
# built as `${SITE_ORIGIN}${path}` — Google OAuth start/callback (both the
# error and success paths), magic-link verify, Stripe checkout success/cancel,
# and the Stripe billing-portal return_url. All of those land the browser on
# this exact host, so it must be a host that serves human-facing pages
# (`/`, `/dashboard/`, `/#pricing`), not the bare Worker.
#
# This was set to the workers.dev URL while the algosize.com custom-domain
# route was believed inactive — but that route (below) binds this same
# Worker at algosize.com/api/*, and it has been live the whole time. With
# SITE_ORIGIN pointed at workers.dev, every one of those redirects sent the
# browser to the bare API Worker instead of the real site: the Worker has no
# route for "/" or "/dashboard/", so its JSON 404 fallthrough is what the
# user saw instead of the marketing site or dashboard. Same-origin calls
# from algosize.com to /api/* still worked throughout (that's the route
# below, unaffected by this var), which is why the API itself looked "up"
# while every redirect-driven flow was broken.
#
# workers_dev = true (below) keeps the *.workers.dev alias published too —
# useful for curl-testing the API directly — but SITE_ORIGIN must name the
# host a human is actually looking at.
#
# Google Cloud Console's authorized redirect URI must match: it needs to be
# https://algosize.com/api/auth/google/callback, not the workers.dev one.
SITE_ORIGIN = "https://algosize.com"
COOKIE_NAME = "algosize_session"
ANALYTICS_DOMAIN  = "algosize.com"
PLAUSIBLE_ENDPOINT = "https://plausible.io"
EMAIL_FROM           = "Algosize <noreply@algosize.com>"
EMAIL_DELEGATED_USER = "noreply@algosize.com"
ADMIN_EMAILS         = "guillaumelauzier@gmail.com"
# Custom report domains (migrations/0015). A Firm customer points a CNAME at
# this hostname; the Worker verifies the record over DNS-over-HTTPS before it
# will call the domain verified. See src/domains.js.
#
# Verifying the record is NOT the same as serving from it: terminating TLS for
# a hostname somebody else owns is Cloudflare for SaaS (custom hostnames),
# which needs zone-level credentials this Worker deliberately does not carry.
# Until that is provisioned, leave CUSTOM_HOSTNAMES_ENABLED unset — the API
# then reports `servingReady: false` and the UI says DNS is correct but the
# hostname is not live yet, rather than implying a domain works when it does
# not. See DEPLOY-account-management.md.
REPORT_CNAME_TARGET  = "cname.algosize.com"
# Error reporting. Leave this UNSET while Sentry is still to be decided: the
# admin settings panel then reports the row as not configured and lists
# SENTRY_DSN as missing, which is the correct reading of "nobody has got to
# it yet".
#
# Set it to "console" to record the opposite decision — that console-only
# logging is deliberate. The panel then says so, stops demanding SENTRY_DSN,
# and still states the cost: Workers logs are not durable, so a production
# exception is unobserved once it scrolls away.
#
# It lives here rather than in the secret store because it is a policy
# choice, not a credential. A decision belongs where it can be read and
# reviewed in a diff; hiding it among the secrets makes it invisible to
# exactly the people it is meant to inform. (SENTRY_DSN itself IS a secret
# and stays in `wrangler secret put`.)
ERROR_REPORTING = "console"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id      = "2a67b8b8fa4444f2b04b4ee7b98407dc"

[[env.production.kv_namespaces]]
binding = "USERS"
id      = "b321f8eeccf0422694b87f719fa0d70c"

# D1 database for user records + run history (Task #25). Created via
# the Cloudflare D1 API on 2026-05-03; schema applied from
# migrations/0001_init.sql against the same uuid. See DEPLOY.md §2.5.
[[env.production.d1_databases]]
binding       = "DB"
database_name = "algosize"
database_id   = "cfe388b1-8423-48ec-b1ec-358e3a8127d8"

# Rendered reports (Task #P-6). Same bucket name in production; create with
#   wrangler r2 bucket create algosize-reports --config wrangler.toml
[[env.production.r2_buckets]]
binding     = "REPORTS"
bucket_name = "algosize-reports"

[[env.production.services]]
binding = "SANDBOX"
service = "algosize-sandbox"

# Per-env blocks do not inherit top-level bindings — see the staging comment.
[env.production.ai]
binding = "AI"

[[env.production.durable_objects.bindings]]
name       = "USAGE"
class_name = "UsageCounter"

[[env.production.migrations]]
# `new_sqlite_classes`, NOT `new_classes` — reversed from the previous
# comment here, which assumed `v1` had already been applied to the live
# script. It had not. That assumption is what made the "never edit an
# applied tag" caution below seem to apply; it doesn't, and here's the
# evidence, not another hypothesis:
#
# A 2026-08-19 deploy (recovering from an unrelated incident — a stray
# Cloudflare "Workers Builds" Git integration repeatedly overwriting this
# script, see wrangler.jsonc's header) failed with `wrangler deploy` actively
# trying to CREATE this class and getting rejected: "Creating new key-value
# backed Durable Object namespaces is no longer supported on this account.
# ... [code: 10099]". Wrangler only attempts creation for a tag the remote
# hasn't recorded as applied — if `v1` had truly been live, this tag would
# have been skipped, not sent. Confirmed independently via the Cloudflare
# API (`GET /accounts/{id}/workers/durable_objects/namespaces`): no
# namespace exists for this script's `UsageCounter` class, or for
# `algosize-staging`'s. There is no existing data this could be migrating —
# `v1` never created anything, ever, on either environment.
#
# So this edit is not "move existing data to SQLite" (nothing to move) and
# not "edit an applied tag's meaning out from under it" (nothing applied).
# It's giving the still-unapplied `v1` the storage backend Cloudflare now
# requires for any new class, so the next real deploy can create it at all.
tag                 = "v1"
new_sqlite_classes  = ["UsageCounter"]

# Scheduled monitoring — see the [triggers]/[[queues]] block near the top for
# why this is split into a cron + a queue, and for the provisioning steps.
# Per-environment blocks do NOT inherit the top-level ones, so these have to
# be repeated rather than assumed.
[env.production.triggers]
crons = ["0 * * * *"]

[[env.production.queues.producers]]
binding = "SCAN_QUEUE"
queue   = "algosize-scans"

[[env.production.queues.consumers]]
queue             = "algosize-scans"
max_batch_size    = 10
max_retries       = 3
dead_letter_queue = "algosize-scans-dlq"

# ----------------------------------------------------------------------------
# Staging overrides (used by `wrangler deploy --env staging`). Task #23.
# Lives at https://staging.algosize.com so risky changes (real analyzer
# integrations, schema migrations, Stripe webhook event additions) can be
# exercised end-to-end against Stripe TEST mode before they hit prod.
# Bound to its own KV namespaces, its own sandbox sibling Worker, its own
# Stripe test-mode secrets, and its own Sentry project (operationally — the
# DSN is just a different secret value). See DEPLOY.md §7.
# ----------------------------------------------------------------------------
[env.staging]
name   = "algosize-staging"
routes = [
  { pattern = "staging.algosize.com/api/*", zone_name = "algosize.com" },
  # Mirrors production — see the note there. Staging gets them too so the
  # OAuth flow is exercisable somewhere that is not production, which is the
  # only place a consent-screen change can be tried against a real browser.
  { pattern = "staging.algosize.com/.well-known/oauth-protected-resource",   zone_name = "algosize.com" },
  { pattern = "staging.algosize.com/.well-known/oauth-authorization-server", zone_name = "algosize.com" },
]

[env.staging.vars]
# Staging site origin: matches the hostname users load the staging site from.
# Drives CORS allow-list, cookie Domain attribute, and Stripe redirect URLs.
SITE_ORIGIN = "https://staging.algosize.com"
COOKIE_NAME = "algosize_session"
ANALYTICS_DOMAIN  = "staging.algosize.com"
PLAUSIBLE_ENDPOINT = "https://plausible.io"
# Staging uses the same Workspace tenant; use a separate mailbox so test
# sends don't touch the production noreply@ inbox.
EMAIL_FROM           = "Algosize Staging <noreply-staging@algosize.com>"
EMAIL_DELEGATED_USER = "noreply-staging@algosize.com"
ADMIN_EMAILS         = "guillaumelauzier@gmail.com"
# Custom report domains (migrations/0015). A Firm customer points a CNAME at
# this hostname; the Worker verifies the record over DNS-over-HTTPS before it
# will call the domain verified. See src/domains.js.
#
# Verifying the record is NOT the same as serving from it: terminating TLS for
# a hostname somebody else owns is Cloudflare for SaaS (custom hostnames),
# which needs zone-level credentials this Worker deliberately does not carry.
# Until that is provisioned, leave CUSTOM_HOSTNAMES_ENABLED unset — the API
# then reports `servingReady: false` and the UI says DNS is correct but the
# hostname is not live yet, rather than implying a domain works when it does
# not. See DEPLOY-account-management.md.
REPORT_CNAME_TARGET  = "cname.algosize.com"

# KV namespace IDs are placeholders. Create the real ones with:
#   wrangler kv namespace create SESSIONS --config wrangler.toml --env staging
#   wrangler kv namespace create USERS    --config wrangler.toml --env staging
# then paste each printed id below. See DEPLOY.md §7.1.
[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id      = "0000000000000000000000000000stg1"

[[env.staging.kv_namespaces]]
binding = "USERS"
id      = "0000000000000000000000000000stg2"

# Separate D1 database for staging (Task #25). Create with
#   wrangler d1 create algosize-staging --config wrangler.toml
# and paste the printed UUID below. See DEPLOY.md §7.1.
[[env.staging.d1_databases]]
binding       = "DB"
database_name = "algosize-staging"
database_id   = "00000000-0000-0000-0000-00000000stg1"

# Separate reports bucket for staging so a staging render can never overwrite
# a report a production customer has already sent to their client. Create with
#   wrangler r2 bucket create algosize-reports-staging --config wrangler.toml
[[env.staging.r2_buckets]]
binding     = "REPORTS"
bucket_name = "algosize-reports-staging"

# Separate sandbox sibling Worker so a bad sandbox deploy can be tested in
# staging without touching prod isolates. Defined in
# `worker-sandbox/wrangler.toml` under its own `[env.staging]` block.
[[env.staging.services]]
binding = "SANDBOX"
service = "algosize-sandbox-staging"

[env.staging.ai]
binding = "AI"

[[env.staging.durable_objects.bindings]]
name       = "USAGE"
class_name = "UsageCounter"

[[env.staging.migrations]]
# See the matching comment on [[env.production.migrations]] above — same
# class, same finding. Short version: `v1` was never actually applied on
# either environment (confirmed via the Cloudflare API, zero Durable Object
# namespaces exist for either script), Cloudflare's account no longer allows
# creating a new key-value backed one, and there is no existing data on this
# environment either, so this is a plain edit to a still-unapplied tag, not
# a migration of anything.
tag                 = "v1"
new_sqlite_classes  = ["UsageCounter"]

# Staging monitors run on their own queue so a staging sweep can never send
# mail about a production org's repositories. Same hourly cadence, so a
# time-of-day setting behaves in staging exactly as it will in production.
[env.staging.triggers]
crons = ["0 * * * *"]

[[env.staging.queues.producers]]
binding = "SCAN_QUEUE"
queue   = "algosize-scans-staging"

[[env.staging.queues.consumers]]
queue             = "algosize-scans-staging"
max_batch_size    = 10
max_retries       = 3
dead_letter_queue = "algosize-scans-staging-dlq"

# ----------------------------------------------------------------------------
# Required SECRETS — never declared in this file.
# ----------------------------------------------------------------------------
#   JWT_SECRET             32+ random bytes; HMAC-SHA-256 key for sessions
#   STRIPE_SECRET_KEY      Stripe API key (sk_test_... / sk_live_...)
#   STRIPE_WEBHOOK_SECRET  Endpoint secret for /api/stripe/webhook
#   STRIPE_PRICE_ID        Price ID for the legacy single monthly plan. Still
#                          used by any checkout that names no tier.
#   STRIPE_PRICE_<PLAN>_<INTERVAL>
#                          One price per tier on the pricing page, e.g.
#                          STRIPE_PRICE_SOLO_MONTHLY, STRIPE_PRICE_FIRM_ANNUAL.
#                          PLAN is SOLO|PRACTICE|FIRM, INTERVAL is
#                          MONTHLY|ANNUAL. An optional _SEAT suffix adds a
#                          per-seat line item on top of the base fee
#                          (STRIPE_PRICE_PRACTICE_MONTHLY_SEAT). A tier with no
#                          price set is refused by POST /api/checkout with 503
#                          plan_not_available — it never falls back to another
#                          price, so an unconfigured tier cannot bill the wrong
#                          amount.
#   OPENAI_API_KEY         OpenAI API key for the algorithm optimizer's LLM
#                          refactor suggestions (Task #16). When unset the
#                          analyzer still returns timing + Big-O — the
#                          suggestion section just shows a "set OPENAI_API_KEY
#                          to enable AI suggestions" notice.
#   GOOGLE_SERVICE_ACCOUNT_JSON
#                          Full JSON key file from Google Cloud Console for
#                          the service account that has domain-wide
#                          delegation on the Workspace tenant for the
#                          gmail.send scope (Task #56). When unset the
#                          worker still creates accounts — sendTransactional
#                          just no-ops with a single warn-level log line.
#                          Provisioning + rotation steps live in DEPLOY.md
#                          §3.6, DNS records (SPF/DKIM/DMARC) in §4.4.
#   GOOGLE_CLIENT_ID       OAuth 2.0 Client ID from Google Cloud Console
#   GOOGLE_CLIENT_SECRET   OAuth 2.0 Client Secret matching the Client ID.
#                          Together they enable the "Sign in with Google"
#                          button on the Starter pricing card. Authorized
#                          redirect URI in Google Cloud Console must be:
#                            <SITE_ORIGIN>/api/auth/google/callback
#                          When unset, the /api/auth/google/start route
#                          redirects to /?auth=google_not_configured and
#                          the rest of the worker keeps working — only the
#                          Google sign-in option is disabled.
#
# Local dev: put these in `worker/.dev.vars` (gitignored). See
# `worker/.dev.vars.example` for the template.
#
# Production: set them with:
#   cd worker && wrangler secret put JWT_SECRET             --config wrangler.toml --env production
#   cd worker && wrangler secret put STRIPE_SECRET_KEY      --config wrangler.toml --env production
#   cd worker && wrangler secret put STRIPE_WEBHOOK_SECRET  --config wrangler.toml --env production
#   cd worker && wrangler secret put STRIPE_PRICE_ID        --config wrangler.toml --env production
#   cd worker && wrangler secret put OPENAI_API_KEY         --config wrangler.toml --env production
#   cd worker && wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON --config wrangler.toml --env production
#   cd worker && wrangler secret put GOOGLE_CLIENT_ID            --config wrangler.toml --env production
#   cd worker && wrangler secret put GOOGLE_CLIENT_SECRET        --config wrangler.toml --env production
#
# Staging: same names, different values (Stripe TEST mode keys, separate
# Sentry project DSN, etc.). Set them with `--env staging`:
#   cd worker && wrangler secret put JWT_SECRET             --config wrangler.toml --env staging
#   cd worker && wrangler secret put STRIPE_SECRET_KEY      --config wrangler.toml --env staging   # sk_test_…
#   cd worker && wrangler secret put STRIPE_WEBHOOK_SECRET  --config wrangler.toml --env staging   # whsec_… from staging endpoint
#   cd worker && wrangler secret put STRIPE_PRICE_ID        --config wrangler.toml --env staging   # price_… from test mode
#   cd worker && wrangler secret put OPENAI_API_KEY         --config wrangler.toml --env staging   # optional
#   cd worker && wrangler secret put SENTRY_DSN             --config wrangler.toml --env staging   # optional, separate project
#   cd worker && wrangler secret put RELEASE_TAG            --config wrangler.toml --env staging

[dev]
port = 8787
ip   = "127.0.0.1"
