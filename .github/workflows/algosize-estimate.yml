name: Algosize infrastructure cost

# Prices the committed compose file on every pull request and, when a ceiling
# is declared, fails the build if the cheapest provider is over it.
#
# What this does NOT do, and will not be made to do: connect to a cloud
# account. There is no credential here and none is accepted. Every figure is
# a list price applied to what the compose file declares — which is why it
# can run on a fork's pull request, and why it says "not your bill" every
# time it reports one.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  estimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Missing secret is a skip with a notice, never a red build. A gate that
      # fails closed on setup is a gate somebody deletes on their first busy
      # afternoon.
      - name: Check for the API key
        id: key
        env:
          ALGOSIZE_API_KEY: ${{ secrets.ALGOSIZE_API_KEY }}
        run: |
          if [ -z "$ALGOSIZE_API_KEY" ]; then
            echo "::notice::ALGOSIZE_API_KEY is not set — skipping the cost estimate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the budget
        if: steps.key.outputs.skip != 'true'
        id: budget
        run: |
          COMPOSE=docker-compose.yml
          CEILING=
          PROVIDERS='["hetzner","aws"]'
          if [ -f algosize.budget.json ]; then
            COMPOSE=$(jq -r '.compose // "docker-compose.yml"' algosize.budget.json)
            CEILING=$(jq -r '.monthlyCeilingUsd // empty' algosize.budget.json)
            PROVIDERS=$(jq -c '.providers // ["hetzner","aws"]' algosize.budget.json)
          fi
          echo "compose=$COMPOSE"     >> "$GITHUB_OUTPUT"
          echo "ceiling=$CEILING"     >> "$GITHUB_OUTPUT"
          echo "providers=$PROVIDERS" >> "$GITHUB_OUTPUT"
          if [ ! -f "$COMPOSE" ]; then
            echo "::notice::No $COMPOSE in this repository — nothing to price."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Estimate
        if: steps.key.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        id: run
        env:
          ALGOSIZE_API_KEY: ${{ secrets.ALGOSIZE_API_KEY }}
        run: |
          jq -n \
            --rawfile compose "${{ steps.budget.outputs.compose }}" \
            --argjson providers '${{ steps.budget.outputs.providers }}' \
            '{inputType:"compose", content:$compose, options:{providers:$providers}}' > payload.json

          HTTP=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "https://algosize.com/api/estimate" \
            -H "Authorization: Bearer $ALGOSIZE_API_KEY" \
            -H "Content-Type: application/json" \
            --data @payload.json)

          # A 402 is the monthly run allowance, not a defect in this pull
          # request. It is a WARNING and a skip, never a red build: the free
          # tier is five runs, an active repository reaches that in an
          # afternoon, and reddening every pull request until someone pays is
          # the fastest way to get this gate deleted — which costs the team
          # their audit as well as us the customer. Exactly the reasoning the
          # missing-key check above is built on, and it applies harder here,
          # because a missing key is a one-time setup step while this recurs
          # every month.
          if [ "$HTTP" = "402" ]; then
            echo "::warning::$(jq -r '.message // "Monthly run allowance exhausted."' response.json)"
            echo "quota=true" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HTTP" != "200" ]; then
            echo "::warning::The estimator returned HTTP $HTTP — annotating without a verdict."
            jq -r '.message // .error // "no detail"' response.json || true
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Cheapest priced provider. "Priced" means it produced at least one
          # line item: a provider whose adapter could price NOTHING reports a
          # total of 0 — the sum of an empty list — and the earlier filter on
          # "!= null" never excluded it, so the provider that knew least always
          # sorted first and the gate compared $0 against the ceiling and
          # passed. A ceiling that a total ignorance of your costs always
          # satisfies is not a ceiling.
          # The range travels with the point estimate. Assumptions widen an
          # estimate — an unknown region, a utilisation guess, a stale catalog —
          # and engine.js reports the width as lower/upper bounds. The gate used
          # only the point estimate, so an $80-$150 estimate against a $100
          # ceiling passed on $95 and said nothing about the $150. That is a
          # coin flip wearing a verdict.
          jq -r '[.providers[] | select((.lineItems | length) > 0)]
                 | sort_by(.estimatedTotalMicroUsd) | .[0]
                 | "cheapest_usd=\(.estimatedTotalMicroUsd / 1000000)",
                   "lower_usd=\((.lowerBoundMicroUsd // .estimatedTotalMicroUsd) / 1000000)",
                   "upper_usd=\((.upperBoundMicroUsd // .estimatedTotalMicroUsd) / 1000000)",
                   "cheapest_name=\(.providerName // .providerId)"' response.json >> "$GITHUB_OUTPUT"
          # Nothing priced anywhere. The gate must not compare a number it does
          # not have, so it says so and annotates instead of passing silently.
          if ! grep -q '^cheapest_usd=' "$GITHUB_OUTPUT"; then
            echo "unpriceable=true" >> "$GITHUB_OUTPUT"
          fi
          jq -r '"resources=\(.normalizedSpec.resources | length)"' response.json >> "$GITHUB_OUTPUT"

      - name: Comment and gate
        if: steps.key.outputs.skip != 'true' && steps.budget.outputs.skip != 'true' && steps.run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CEILING:  ${{ steps.budget.outputs.ceiling }}
          USD:      ${{ steps.run.outputs.cheapest_usd }}
          LOWER:    ${{ steps.run.outputs.lower_usd }}
          UPPER:    ${{ steps.run.outputs.upper_usd }}
          NAME:     ${{ steps.run.outputs.cheapest_name }}
          RESOURCES: ${{ steps.run.outputs.resources }}
          UNPRICEABLE: ${{ steps.run.outputs.unpriceable }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Nothing could be priced on any provider. There is no number, so
          # there is nothing to compare against the ceiling — and passing a
          # gate on a number you do not have is the failure this whole comment
          # exists to prevent. Say what happened and annotate.
          if [ "$UNPRICEABLE" = "true" ]; then
            {
              echo "<!-- algosize-estimate -->"
              echo "### Infrastructure cost"
              echo
              echo "**Could not price this configuration.** $RESOURCES resource(s) were read, and"
              echo "none of them are in our pricing catalog for any provider yet."
              echo
              echo "No ceiling was applied, because there is no total to apply one to. This is a gap"
              echo "in what Algosize can price, not a finding about your configuration."
            } > comment.md
            gh pr comment "$PR" --body-file comment.md --edit-last || \
              gh pr comment "$PR" --body-file comment.md
            exit 0
          fi

          VERDICT="No ceiling is set, so this is an annotation only."
          FAIL=0
          if [ -n "$CEILING" ]; then
            # Three outcomes, because a range against a line has three
            # relationships and only two of them are a verdict.
            if awk "BEGIN{exit !($UPPER <= $CEILING)}"; then
              VERDICT="Within the \$$CEILING/mo ceiling, at the top of the range too."
            elif awk "BEGIN{exit !($LOWER > $CEILING)}"; then
              VERDICT="Over the \$$CEILING/mo ceiling, at the bottom of the range too."
              FAIL=1
            else
              # The ceiling falls INSIDE the estimate. We do not know, and the
              # honest answer is to say so rather than to pick the end that
              # happens to give a verdict. Deliberately does not fail the build:
              # turning "we cannot tell" into a red build is the same
              # overreach in the other direction.
              VERDICT="Cannot say. The \$$CEILING/mo ceiling falls inside the estimate's own range (\$$LOWER to \$$UPPER), so this configuration may be over or under it. Narrow the range by supplying a region and a utilisation figure, or read the assumptions in the full report."
            fi
          fi

          {
            echo "<!-- algosize-estimate -->"
            echo "### Infrastructure cost"
            echo
            echo "**\$$USD / month** on $NAME — cheapest of the priced providers, $RESOURCES resources."
            if [ "$LOWER" != "$UPPER" ]; then
              echo
              echo "Range \$$LOWER to \$$UPPER, from the assumptions this estimate had to make."
            fi
            echo
            echo "$VERDICT"
            echo
            echo "_List prices against the committed compose file. Not a quote, and not your bill._"
            echo "_No cloud account was contacted and no credential was used._"
          } > comment.md

          gh pr comment "$PR" --body-file comment.md --edit-last || \
            gh pr comment "$PR" --body-file comment.md

          if [ "$FAIL" = "1" ]; then
            echo "::error::Estimated monthly cost \$$USD exceeds the \$$CEILING ceiling."
            exit 1
          fi
