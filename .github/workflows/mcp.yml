name: Worker suite and MCP

# The Worker's pull-request gate.
#
# It exists separately from worker.yml because worker.yml only runs on push to
# main and staging — it is the deploy pipeline, so the full worker suite gets
# its first CI exposure at merge time, when a failure fails a production
# deploy. That is the wrong moment to learn anything is broken.
#
# This one runs on PULL REQUESTS, so a change is tested before it can be
# merged rather than while it is deploying.
#
# ---------------------------------------------------------------------------
# Why the path filter is `worker/**` and not a list of MCP paths
# ---------------------------------------------------------------------------
# It was that list, and the list was the bug. The filter named
# worker/src/mcp/**, handlers/mcp.js, analyzers/llm.js, migrations/** and the
# MCP test scripts — so a pull request touching src/index.js (the router),
# src/monitors/**, src/quota.js, src/auth.js or anything else under worker/
# matched nothing here, ran no tests, and went green on the four analyzer
# checks alone. Those scan the repository; they do not execute the suite.
#
# The gap was found the honest way: a PR rewriting the QUEUE ENTRYPOINT —
# where getting it wrong redelivers dead messages forever — reported six green
# checks having run zero worker tests. A narrow filter on the only workflow
# that runs `npm test` is indistinguishable from having no pull-request gate
# at all for most of the Worker.
#
# So: anything under worker/ runs the suite. The MCP-specific steps below stay
# and stay first, because they are fast and they name their failures precisely;
# running them on a monitors change costs seconds and occasionally catches a
# real coupling.
on:
  pull_request:
    paths:
      - "worker/**"
      - "mcp/**"
      - ".mcp.json"
      - ".cursor/mcp.json"
      - ".github/workflows/mcp.yml"
      - ".github/workflows/mcp-publish.yml"
  push:
    branches: [main]
    paths:
      - "worker/src/mcp/**"
      - "worker/src/handlers/mcp.js"
      - "mcp/**"

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Ordered cheapest-and-most-structural first, so a purity violation —
      # the one failure that would otherwise pass every functional test while
      # silently giving analyses away for free — is reported in seconds rather
      # than after the whole protocol suite has run.
      - name: Purity guard (no tool may bypass callHandler)
        working-directory: worker
        run: node scripts/test-mcp-purity.mjs

      - name: MCP protocol, sessions, scopes and tools
        working-directory: worker
        run: node scripts/test-mcp-protocol.mjs

      - name: Workers AI model routing (Kimi K3 vs K2.6)
        working-directory: worker
        run: node scripts/test-llm-routing.mjs

      # No install step: the bridge has zero dependencies, deliberately. It
      # ships over npx onto other people's machines, and every dependency
      # would be one more thing to audit there.
      - name: stdio bridge
        run: node mcp/test/smoke.test.mjs

      - name: Bridge declares no runtime dependencies
        run: |
          node -e '
            const pkg = require("./mcp/package.json");
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length) {
              console.error("The bridge must stay dependency-free; found: " + deps.join(", "));
              process.exit(1);
            }
            console.log("bridge has no runtime dependencies");
          '

      # The scanner, run over the repository that contains it, using THIS
      # commit's rules rather than the deployed Worker's.
      #
      # The four Algosize checks on a pull request post the repo's files to
      # https://algosize.com and are answered by whatever is deployed there.
      # That is right for a normal change and a trap for a change to an
      # analyzer: the gate scans the fix with the bug the fix removes. It
      # happened on #101, where nine of fourteen findings were already fixed
      # by the diff being reviewed and nothing on the page said so.
      #
      # This step closes that loop. It imports the pure analyzer directly —
      # no credentials, no network, no Worker runtime — so an analyzer change
      # is checked by the analyzer it changes, on the same commit.
      - name: Self-scan with this commit's analyzer
        working-directory: worker
        run: npm run selfscan

      # The full suite last. It is the slowest, and by this point the
      # MCP-specific failures have already been surfaced with a clear name.
      - name: Full worker suite
        working-directory: worker
        run: npm test
